<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CV Match Optimizer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Merriweather:wght@300;400;700&family=Roboto:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
      }
      
      @media print {
        @page {
          margin: 0;
          size: auto;
        }

        body {
          background-color: white;
          margin: 0;
          padding: 0;
        }

        /* Hide everything by default */
        body * {
          visibility: hidden;
        }

        /* Show only the resume container and its children */
        #printable-resume, #printable-resume * {
          visibility: visible;
        }

        /* Position the resume container absolutely to cover the page */
        #printable-resume {
          position: absolute;
          left: 0;
          top: 0;
          width: 100%;
          margin: 0;
          padding: 0;
          background-color: white;
          box-shadow: none !important;
          /* Ensure borders and colors are printed */
          -webkit-print-color-adjust: exact;
          print-color-adjust: exact;
        }

        /* Hide specific elements that might sneak in */
        .no-print, header, nav, footer, button, .theme-selector {
          display: none !important;
        }
      }
    </style>
